<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonVisual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/placeholder.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/header.css">
  </head>
  <body>

    <header class="site-header">
      <img class="site-logo" src="/static/img/pythonvisual-logo.png" alt="Logo PythonVisual">
      <div class="header-text">
        <h1>PythonVisual</h1>
      </div>
      {% include "_navigation.html" %}
      <div class="accessibility-controls" aria-label="Controles de acessibilidade">
        {% include "_language_switch.html" %}
        <button class="btn-access" type="button" onclick="alterarFonte(-0.1)" title="Diminuir fonte" data-i18n-title="access.fontDown"><i class="fa-solid fa-magnifying-glass-minus"></i><span>A-</span></button>
        <button class="btn-access" type="button" onclick="alterarFonte(0.1)" title="Aumentar fonte" data-i18n-title="access.fontUp"><i class="fa-solid fa-magnifying-glass-plus"></i><span>A+</span></button>
        <button class="btn-access" type="button" id="btn-tema" onclick="alternarTema()" title="Alternar tema claro e escuro" data-i18n-title="access.themeToggle"><i class="fa-solid fa-moon" id="tema-icone"></i><span id="tema-label">Tema escuro</span></button>
      </div>
    </header>

    <p class="intro-visualizador" data-i18n="app.subtitle">Analise a execução do seu código Python passo a passo</p>

    <div class="main">
      <div class="coluna-esquerda">
        <div class="card" id="codigo-card">
          <div class="card-header">
            <span class="card-header-title"><i class="fa-solid fa-terminal"></i><span data-i18n="section.code">Código</span></span>
            <button class="btn-recolher" type="button" onclick="alternarCard('codigo-card')" aria-expanded="true" aria-controls="codigo-corpo"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>
          </div>
          <div class="card-body" id="codigo-corpo" style="padding: 12px 16px 10px;">
            <div class="exemplos-row">
              <label for="exemplos" data-i18n="examples.label">Exemplo:</label>
              <select id="exemplos" onchange="carregarExemplo()">
                <option value="" data-i18n="examples.choose">-- Escolha um exemplo --</option>
                <option value="variaveis" data-i18n="examples.variables">Variáveis e operações</option>
                <option value="condicional" data-i18n="examples.conditional">Condicional (if/else)</option>
                <option value="loop_for" data-i18n="examples.forLoop">Loop com for</option>
                <option value="loop_while" data-i18n="examples.whileLoop">Loop com while</option>
                <option value="funcao" data-i18n="examples.function">Função simples</option>
                <option value="fatorial" data-i18n="examples.factorial">Fatorial (recursão)</option>
                <option value="fibonacci" data-i18n="examples.fibonacci">Fibonacci</option>
                <option value="lista" data-i18n="examples.list">Manipulação de lista</option>
                <option value="dicionario" data-i18n="examples.dictionary">Dicionário</option>
                <option value="tupla" data-i18n="examples.tuple">Tupla</option>
                <option value="input" data-i18n="examples.input">Entrada com input()</option>
                <option value="bhaskara" data-i18n="examples.bhaskara">Fórmula de Bhaskara</option>
                <option value="classe" data-i18n="examples.class">Classe e objeto</option>
                <option value="try_except" data-i18n="examples.tryExcept">Try/except</option>
                <option value="bubble_sort" data-i18n="examples.bubbleSort">Bubble Sort</option>
              </select>
            </div>
            <textarea id="codigo"></textarea>
          </div>
        </div>

        <div class="acoes-codigo">
          <button class="btn-executar" id="btn-run" type="button" onclick="executar()" aria-label="Executar código" data-i18n-aria="actions.run"><i class="fa-solid fa-play"></i><span data-i18n="actions.run">Executar código</span></button>
          <button class="btn-limpar" id="btn-clear" type="button" onclick="limparCodigo()" title="Limpar o código atual" data-i18n-title="actions.clearTitle"><i class="fa-solid fa-eraser"></i><span data-i18n="actions.clear">Limpar</span></button>
        </div>

        <div class="card" id="navegacao">
          <div class="card-header">
            <span class="card-header-title"><i class="fa-solid fa-route"></i><span data-i18n="section.navigation">Navegação</span></span>
            <button class="btn-recolher" type="button" onclick="alternarCard('navegacao')" aria-expanded="true" aria-controls="navegacao-corpo"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>
          </div>
          <div class="card-body nav-container" id="navegacao-corpo">
            <div class="nav-buttons">
              <button class="btn-nav" id="btn-primeiro" type="button" onclick="irParaPrimeiro()"><i class="fa-solid fa-backward-fast"></i><span data-i18n="navSteps.first">Início</span></button>
              <button class="btn-nav" id="btn-anterior" type="button" onclick="passo(-1)"><i class="fa-solid fa-chevron-left"></i><span data-i18n="navSteps.previous">Anterior</span></button>
              <div class="contador" id="contador"></div>
              <button class="btn-nav" id="btn-proximo" type="button" onclick="passo(1)"><span data-i18n="navSteps.next">Próximo</span><i class="fa-solid fa-chevron-right" style="margin-left:6px;margin-right:0;"></i></button>
              <button class="btn-nav" id="btn-ultimo" type="button" onclick="irParaUltimo()"><span data-i18n="navSteps.last">Fim</span><i class="fa-solid fa-forward-fast" style="margin-left:6px;margin-right:0;"></i></button>
            </div>
            <input type="range" id="slider" min="0" value="0" oninput="irPara(this.value)">
          </div>
        </div>

        <div class="card" id="explicacao-card" style="display:none;">
          <div class="card-header">
            <span class="card-header-title"><i class="fa-solid fa-lightbulb"></i><span data-i18n="section.explanation">Explicação da linha atual</span><span id="explicacao-linha-numero"></span></span>
            <button class="btn-recolher" type="button" onclick="alternarCard('explicacao-card')" aria-expanded="true" aria-controls="explicacao-corpo"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>
          </div>
          <div class="card-body explicacao-linha" id="explicacao-corpo"></div>
        </div>

      </div>

      <div class="coluna-direita">
        <div class="card" id="saida" style="display:none;">
          <div class="card-header">
            <span class="card-header-title"><i class="fa-solid fa-diagram-project"></i><span data-i18n="section.visualization">Visualização</span></span>
            <button class="btn-recolher" type="button" onclick="alternarCard('saida')" aria-expanded="true" aria-controls="saida-corpo"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>
          </div>
          <div class="card-body" id="saida-corpo"></div>
        </div>

        <div class="card" id="entrada-card" style="display:none;">
          <div class="card-header"><span class="card-header-title"><i class="fa-solid fa-keyboard"></i><span data-i18n="section.input">Entrada solicitada</span></span></div>
          <div class="card-body">
            <div class="entrada-linha-info">
              <span class="entrada-linha-badge" id="entrada-linha-badge">Linha -</span>
              <span id="entrada-prompt-texto" data-i18n="input.promptDefault">Informe o valor solicitado por input().</span>
            </div>
            <div class="entrada-form">
              <input id="entrada" class="entrada-area" type="text" autocomplete="off" placeholder="Digite o valor para esta linha" data-i18n-placeholder="input.placeholder">
              <button class="btn-entrada" type="button" onclick="enviarEntradaPendente()"><i class="fa-solid fa-paper-plane"></i><span data-i18n="input.send">Enviar</span></button>
            </div>
          </div>
        </div>

        <div class="card" id="saida-card" style="display:none;">
          <div class="card-header">
            <span class="card-header-title"><i class="fa-solid fa-print"></i><span data-i18n="output.section">Saída</span></span>
            <button class="btn-recolher" type="button" onclick="alternarCard('saida-card')" aria-expanded="true" aria-controls="saida-programa-corpo"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>
          </div>
          <div class="card-body" id="saida-programa-corpo"></div>
        </div>

        <div class="card" id="pilha-card" style="display:none;">
          <div class="card-header">
            <span class="card-header-title"><i class="fa-solid fa-layer-group"></i><span data-i18n="stack.title">Pilha de chamadas</span></span>
            <button class="btn-recolher" type="button" onclick="alternarCard('pilha-card')" aria-expanded="true" aria-controls="pilha-corpo"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>
          </div>
          <div class="card-body" id="pilha-corpo"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/static/js/app.js"></script>

  </body>
</html>
